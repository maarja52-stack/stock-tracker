<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupplyHub</title>
    <link rel="stylesheet" href="assets/auth.css" />
    <style>
      .global-footer {
        text-align: center;
        color: #9ca9b8;
        font-size: 0.9rem;
        padding: 0.25rem 1rem 1.5rem;
        display: grid;
        gap: 0.2rem;
      }

      .global-footer-version {
        color: #d4af37;
        font-weight: 700;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="compact-shell">
      <a class="tiny-back" href="index.html">← Back</a>
      <article class="status-card compact-card" id="qr">
        <button type="button" class="dropdown-toggle" id="qrToggle" aria-expanded="false">
          <span>QR Generation</span>
          <span class="dropdown-icon">▾</span>
        </button>
        <div class="dropdown-panel" id="qrPanel" hidden>
          <p class="muted">Generate a scan-ready link for minibartracker.space using the item, location, and category.</p>
          <form id="qrForm" class="qr-controls">
            <label class="field-row">
              <span>Item name</span>
              <input id="qrItem" name="qrItem" type="text" value="Toilet Paper" required />
            </label>
            <label class="field-row">
              <span>Location</span>
              <input id="qrLocation" name="qrLocation" type="text" value="F3-07" required />
            </label>
            <label class="field-row">
              <span>Category</span>
              <input id="qrCategory" name="qrCategory" type="text" value="Housekeeping" required />
            </label>
            <button type="submit">Generate QR</button>
          </form>
          <div id="qrResult" class="message"></div>
          <div class="qr-preview-card">
            <div class="qr-label">
              <div class="qr-label-title">Generated scan URL</div>
              <div id="qrPayload" class="qr-payload-summary">No QR generated yet.</div>
            </div>
            <div class="qr-canvas-wrap">
              <canvas id="qrCanvas" width="220" height="220"></canvas>
            </div>
            <button type="button" id="printQrBtn" class="secondary-btn">Print QR</button>
          </div>
          <div class="qr-preview-card">
            <button type="button" class="dropdown-toggle secondary-toggle" id="savedQrToggle" aria-expanded="false">
              <span>Saved QR codes</span>
              <span class="dropdown-icon">▾</span>
            </button>
            <div class="dropdown-panel" id="savedQrPanel" hidden>
              <div id="savedQrList" class="saved-qr-list"></div>
            </div>
          </div>

          <div class="qr-preview-card">
            <div class="qr-label">
              <div class="qr-label-title">Stock Locations QR</div>
              <div class="muted">Generate one QR per stock location.</div>
            </div>
            <select id="locationQrSelect" class="field-row">
              <option value="Floor 1 Storage">Floor 1 Storage</option>
              <option value="Floor 2 Storage">Floor 2 Storage</option>
              <option value="Floor 3 Storage">Floor 3 Storage</option>
              <option value="Garage">Garage</option>
              <option value="Luggage Room">Luggage Room</option>
            </select>
            <button type="button" id="generateLocationQrBtn" class="secondary-btn">Generate Location QR</button>
            <div id="locationQrResult" class="message"></div>
            <div class="qr-canvas-wrap">
              <canvas id="locationQrCanvas" width="220" height="220"></canvas>
            </div>
            <div id="locationQrUrl" class="qr-payload-summary"></div>
          </div>
        </div>
      </article>
    </div>

    <footer class="global-footer">
      <span>© M.A.2026</span>
      <span class="global-footer-version">v154 (1d9f3a9).2608061321</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <script src="assets/auth.js"></script>
  </body>
</html>
